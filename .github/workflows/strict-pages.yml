name: Strict Pages release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}
concurrency:
  group: strict-pages-release
  cancel-in-progress: false

jobs:
  source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      mode: ${{ steps.pages.outputs.mode }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          case "$mode" in legacy|workflow) ;; *) exit 1 ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    if: github.event_name == 'workflow_dispatch' || needs.source.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: site
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: rxslice/hallux
          ref: 512c2f43d8912ca78953cbc8bf521cd7bc9fb3fb
          path: hallux
          token: ${{ secrets.HALLUX_CONTENTS_READ }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build and package the production site
        working-directory: site
        env:
          BLVKWARE_REQUIRE_HALLUX: '1'
        run: |
          python -m pip install 'cryptography>=41'
          python dev/build-static.py
          python dev/package-pages.py docs "$RUNNER_TEMP/artifact.tar"
          sha256sum "$RUNNER_TEMP/artifact.tar" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [source, build]
    if: needs.source.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
